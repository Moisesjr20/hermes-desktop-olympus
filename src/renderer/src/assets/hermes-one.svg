<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 711 131" width="711" height="131">
  <defs>
    <linearGradient id="skyBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E3A5F"/>
      <stop offset="1" stop-color="#0A1628"/>
    </linearGradient>
  </defs>
  <!-- fundo transparente — deixa parent decidir -->
  
  <!-- Logo quadrado à esquerda (navy + monte + raio) -->
  <g transform="translate(5,5)">
    <rect width="121" height="121" rx="22" ry="22" fill="url(#skyBg)"/>
    <!-- pico menor atrás -->
    <polygon points="10,100 42,55 72,100" fill="#F1F5F9" fill-opacity="0.65"/>
    <!-- monte principal -->
    <polygon points="20,100 60,28 112,100" fill="#F1F5F9"/>
    <!-- raio Zeus -->
    <polygon points="65,28 55,60 65,60 52,100 76,52 65,52 76,28" fill="#F59E0B"/>
  </g>
  
  <!-- OLYMPUS wordmark grande -->
  <g transform="translate(150,0)">
    <text x="0" y="92"
          font-family="Impact, 'Arial Black', sans-serif"
          font-weight="900"
          font-size="92"
          letter-spacing="6"
          fill="#F1F5F9">OLYMPUS</text>
  </g>
</svg>
