<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 711 131" width="711" height="131">
  <!-- OLYMPUS wordmark + mini-monte icon à esquerda -->
  <g>
    <!-- mini monte icon (silhueta sólida) -->
    <polygon points="20,110 70,30 120,110" fill="white"/>
    <polygon points="60,110 85,70 110,110" fill="white" opacity="0.75"/>
    <!-- raio -->
    <polygon points="78,30 68,70 78,70 60,110 95,55 78,55 95,30" fill="white" opacity="0.9"/>
  </g>
  <!-- OLYMPUS letras grandes (fonte estêncil geométrica) -->
  <g transform="translate(170,0)">
    <text x="0" y="92"
          font-family="Impact, 'Arial Black', 'Helvetica Neue', sans-serif"
          font-weight="900"
          font-size="92"
          letter-spacing="8"
          fill="white">OLYMPUS</text>
  </g>
</svg>
